<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mini Shopee</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/login.js" defer></script>
</head>
<body class="login-body">
    
    <!-- Tombol Dark Mode Khusus Halaman Login -->
    <div class="theme-toggle-container">
        <button id="darkModeToggle" class="btn-icon">🌙</button>
    </div>

    <div class="login-container">
        <div class="login-card">
            <h2>Selamat Datang</h2>
            <p>Silakan masuk ke akunmu</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Masukkan username" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Masukkan password" required>
                        <span id="togglePassword" class="toggle-pwd-btn">Lihat</span>
                    </div>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Ingat Username Saya</label>
                </div>
                
                <button type="submit" id="loginBtn" class="btn-submit">
                    <span id="btnText">Masuk</span>
                    <div id="spinner" class="spinner hidden"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Notification (Error Handling) -->
    <div id="toast" class="toast hidden"></div>

</body>
</html>
